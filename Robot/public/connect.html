<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runway Robot</title>
  <style>
    :root { color: #182b3d; font-family: "Segoe UI", sans-serif; background: #f3f7fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(440px, calc(100vw - 48px)); }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; background: #0875bd; color: white; font-size: 28px; font-weight: 700; }
    .eyebrow { margin: 28px 0 8px; color: #587086; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 34px; letter-spacing: 0; }
    p { color: #536b80; line-height: 1.55; }
    label { display: grid; gap: 8px; margin-top: 28px; color: #31485b; font-size: 14px; font-weight: 700; }
    input { padding: 13px; border: 1px solid #b1c1cf; background: white; color: #182b3d; font: inherit; }
    button { width: 100%; margin-top: 22px; border: 0; background: #0875bd; color: white; cursor: pointer; padding: 13px; font: 600 16px "Segoe UI", sans-serif; }
    #message { min-height: 20px; margin-top: 14px; color: #a4262c; }
    .note { border-top: 1px solid #d4dee7; margin-top: 34px; padding-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">R</div>
    <p class="eyebrow">RUNWAY ROBOT</p>
    <h1>Connect Robot</h1>
    <p>Connect this Windows machine to Runway. Once connected, Robot continues in the system tray and accepts authenticated workflow jobs.</p>
    <label>Runway server URL<input id="serverUrl" type="url" placeholder="http://runway-host:5050" /></label>
    <button id="connect">Connect and start Robot</button>
    <p id="message" role="alert"></p>
    <p class="note"><strong>Robot listener</strong><br />Runway can trigger jobs at this machine's configured Robot listener endpoint after connection.</p>
  </main>
  <script>
    const input = document.querySelector('#serverUrl');
    const message = document.querySelector('#message');
    const button = document.querySelector('#connect');
    window.robotAPI.status().then((status) => { if (status.serverUrl) input.value = status.serverUrl; });
    button.addEventListener('click', async () => {
      button.disabled = true;
      message.textContent = '';
      const result = await window.robotAPI.connect(input.value);
      button.disabled = false;
      if (!result.ok) message.textContent = result.message || 'Could not connect Robot.';
    });
  </script>
</body>
</html>
